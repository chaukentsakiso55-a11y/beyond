<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050811"><meta name="apple-mobile-web-app-capable" content="yes"><title>Infinity Remote</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#050811;color:#eefaff}.s{max-width:760px;margin:auto;padding:16px 14px 92px}.h{display:flex;align-items:center;gap:10px;padding:10px 0}.inf{font-size:36px;color:#46e6ff;font-weight:900}.muted{color:#7896aa;font-size:12px}.card{background:#0d1728;border:1px solid #18344e;border-radius:20px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#101d30;border-radius:15px;padding:12px}.stat b{display:block;font-size:20px}button,input,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px;background:#101d30;color:#eefaff;font-weight:750}button.primary{background:#147f9a}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}textarea,input{width:100%;background:#101d30;color:#eefaff;border:1px solid #18344e;border-radius:13px;padding:12px;font-size:16px}textarea{min-height:90px}.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(740px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);background:#09111fee;border:1px solid #18344e;border-radius:20px;padding:6px;backdrop-filter:blur(18px)}.nav button{font-size:11px}.page{display:none}.page.on{display:block}.log{white-space:pre-wrap;color:#55efb3;font-size:12px;margin-top:8px}.item{padding:10px;border-bottom:1px solid #18344e}.chat{max-height:380px;overflow:auto}.bubble{padding:10px;border-radius:14px;margin:7px 0;background:#101d30;white-space:pre-wrap}.ai{border-left:3px solid #a477ff}.me{border-left:3px solid #46e6ff}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#101d30;color:#46e6ff;font-size:10px}.danger{color:#ff6b86!important}@media(min-width:560px){.grid,.quick{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="s"><header class="h"><div class="inf">∞</div><div><b>Infinity Remote</b><div class="muted">PHONE COMPANION · DESKTOP STAYS NATIVE</div></div><span class="tag" id="link">LINKING</span></header>
<section id="home" class="page on"><div class="card"><b>Infinity Core Link</b><div class="muted" id="host">Loading…</div></div><div class="grid"><div class="stat">CPU<b id="cpu">--</b></div><div class="stat">RAM<b id="ram">--</b></div><div class="stat">Storage<b id="disk">--</b></div><div class="stat">Battery<b id="battery">--</b></div></div><div class="card"><b>Quick controls</b><div class="quick"><button data-c="open whatsapp">WhatsApp</button><button data-c="open chrome">Chrome</button><button data-c="open vscode">VS Code</button><button data-c="open file explorer">Files</button><button data-c="volume up">Volume +</button><button data-c="mute">Mute</button><button data-c="play pause">Play / Pause</button><button data-c="next track">Next Track</button><button data-c="focus 25 minutes">Focus 25</button></div><div id="qout" class="log"></div></div></section>
<section id="aegis" class="page"><div class="card"><b>AEGIS</b><div id="chat" class="chat"></div><textarea id="msg" placeholder="Ask AEGIS from your phone"></textarea><button class="primary" id="send" style="width:100%;margin-top:8px">Send</button></div></section>
<section id="control" class="page"><div class="card"><b>Agent command</b><p class="muted">AEGIS plans multi-step desktop and browser tasks. Sensitive permissions require confirmation.</p><textarea id="cmd" placeholder="Open Chrome, search for Android Studio docs, then open VS Code"></textarea><button class="primary" id="run" style="width:100%;margin-top:8px">Plan & run</button><button id="confirm" style="width:100%;margin-top:8px;display:none">Confirm sensitive permissions</button><div id="out" class="log"></div></div></section>
<section id="info" class="page"><div class="card"><b>Notifications</b><div id="notes"></div></div><div class="card"><b>Running apps</b><div id="apps"></div></div></section>
<section id="device" class="page"><div class="card"><b>Clipboard</b><textarea id="clip" placeholder="Shared clipboard text"></textarea><div class="quick"><button id="getclip">Get from laptop</button><button id="setclip">Send to laptop</button></div></div><div class="card"><b>Files</b><input id="file" type="file"><button id="upload" style="width:100%;margin-top:8px">Upload to Infinity Share</button><div id="fileout" class="log"></div><div id="filelist"></div></div><div class="card"><button class="danger" id="forget" style="width:100%">Unpair this phone</button></div></section>
</main><nav class="nav"><button data-p="home">Home</button><button data-p="aegis">AEGIS</button><button data-p="control">Control</button><button data-p="info">Activity</button><button data-p="device">Device</button></nav><script>
let token=new URLSearchParams(location.search).get('token')||localStorage.getItem('infinity_token')||'';if(token){localStorage.setItem('infinity_token',token);history.replaceState({},'',location.pathname)}const E=id=>document.getElementById(id),api=(p,o={})=>fetch(p+(p.includes('?')?'&':'?')+'token='+encodeURIComponent(token),o);document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===b.dataset.p));if(b.dataset.p==='info')activity();if(b.dataset.p==='device')loadFiles()});async function status(){try{let r=await api('/api/status');if(!r.ok)throw 0;let d=await r.json();E('link').textContent='ONLINE';E('host').textContent=d.host+' · '+d.platform;E('cpu').textContent=Math.round(d.cpu)+'%';E('ram').textContent=Math.round(d.ram)+'%';E('disk').textContent=Math.round(d.disk)+'%';E('battery').textContent=d.battery==null?'N/A':Math.round(d.battery)+'%'}catch(e){E('link').textContent='OFFLINE';E('host').textContent='Disconnected'}}setInterval(status,4000);status();let pending='';async function command(c,target=E('out')){target.textContent='Planning…';let d=await (await api('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:c})})).json();target.textContent=d.message||JSON.stringify(d);if(d.requires_confirmation){pending=d.request_id;E('confirm').style.display='block'}}E('run').onclick=()=>command(E('cmd').value);E('confirm').onclick=async()=>{let d=await (await api('/api/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request_id:pending})})).json();E('out').textContent=d.message||JSON.stringify(d);E('confirm').style.display='none'};document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>command(b.dataset.c,E('qout')));let hist=[],chatId='';function render(){E('chat').innerHTML='';hist.slice(-30).forEach(m=>{let x=document.createElement('div');x.className='bubble '+(m.role==='user'?'me':'ai');x.textContent=m.content;E('chat').appendChild(x)});E('chat').scrollTop=E('chat').scrollHeight}async function syncChat(){try{let d=await (await api('/api/chat')).json();chatId=d.chat_id||'';hist=d.messages||[];render()}catch(e){render()}}syncChat();E('send').onclick=async()=>{let m=E('msg').value.trim();if(!m)return;hist.push({role:'user',content:m});render();E('msg').value='';let d=await (await api('/api/aegis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,chat_id:chatId})})).json();chatId=d.chat_id||chatId;await syncChat()};async function activity(){let d=await (await api('/api/activity')).json();E('notes').innerHTML=(d.notifications||[]).map(n=>'<div class="item"><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.body)+'</div></div>').join('')||'<div class="muted">No notifications</div>';E('apps').innerHTML=(d.processes||[]).slice(0,20).map(p=>'<div class="item">'+esc(p.name)+' <span class="muted">'+Math.round(p.cpu)+'% CPU</span></div>').join('')};E('getclip').onclick=async()=>{let d=await (await api('/api/clipboard')).json();E('clip').value=d.text||''};E('setclip').onclick=async()=>{await api('/api/clipboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:E('clip').value})})};async function loadFiles(){let d=await (await api('/api/files')).json();E('filelist').innerHTML=(d.files||[]).map(f=>'<div class="item"><a style="color:#46e6ff" href="/api/download?token='+encodeURIComponent(token)+'&name='+encodeURIComponent(f.name)+'">'+esc(f.name)+'</a></div>').join('')||'<div class="muted">No shared files</div>'}E('upload').onclick=()=>{let f=E('file').files[0];if(!f)return; if(f.size>8*1024*1024){E('fileout').textContent='8 MB limit';return}let r=new FileReader();r.onload=async()=>{let d=await (await api('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,data:String(r.result).split(',')[1]||''})})).json();E('fileout').textContent=d.message||'';loadFiles()};r.readAsDataURL(f)};E('forget').onclick=async()=>{await api('/api/revoke',{method:'POST'});localStorage.removeItem('infinity_token');location.href='/'};setInterval(()=>{if(E('info').classList.contains('on'))activity()},7000);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}</script></body></html>
