<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050811"><title>Pair Infinity</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><style>*{box-sizing:border-box}body{font-family:system-ui;background:#050811;color:#eefaff;padding:24px;margin:0;background:radial-gradient(circle at 50% 0,#101d30,#050811 55%)}.c{max-width:480px;margin:6vh auto;background:#0d1728;border:1px solid #18344e;border-radius:24px;padding:22px}.logo{font-size:48px;color:#46e6ff;font-weight:900}.m{color:#7896aa}input,button{width:100%;padding:14px;margin:6px 0;border-radius:13px;border:1px solid #18344e;font-size:16px}input{background:#101d30;color:white}button{background:#147f9a;color:white;font-weight:800}</style></head><body><main class="c"><div class="logo">∞</div><h1>Pair Infinity Remote</h1><p class="m">This phone connects to the native Infinity OS desktop. The laptop UI stays native.</p><form action="/pair"><input name="pin" maxlength="6" inputmode="numeric" placeholder="6-digit PIN" required><input name="name" maxlength="80" value="My phone" placeholder="Device name"><button>Pair phone</button></form><p class="m">Use only on a Wi-Fi network you trust.</p></main></body></html>
