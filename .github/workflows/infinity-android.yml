name: Infinity OS Android APK
on:
  push:
    branches: ["main"]
    paths: ["infinity-android-source.zip", ".github/workflows/infinity-android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: rm -rf android && mkdir android && unzip -q infinity-android-source.zip -d android
      - run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Infinity-OS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
